name: Bamousso RH CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install server dependencies and build
        run: |
          cd server
          npm install
          npm run build

      - name: Install client dependencies and build
        run: |
          cd client
          npm install
          npm run build
