// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force 'io.netty:netty-codec-http:4.1.118.Final'
            force 'io.netty:netty-codec-http2:4.1.118.Final'
            force 'io.netty:netty-handler:4.1.118.Final'
            force 'io.netty:netty-common:4.1.118.Final'
            force 'io.netty:netty-transport-native-unix-common:4.1.118.Final'
            force 'io.netty:netty-codec:4.1.118.Final'
            force 'io.netty:netty-handler-proxy:4.1.118.Final'
            force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
            force 'io.opentelemetry:opentelemetry-api:1.62.0'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
